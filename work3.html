<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    *{
        font-size: x-large;
        border-collapse: collapse;
    }
  </style>
  <body>
    <table
      border="1"
      style="table-layout: fixed; width: 500px"
      cellpadding="2"
      align="center"
    >
      <thead style="background-color: blueviolet;" align="center">
        <tr>
          <td>Name</td>
          <td>Value</td>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Name</td>
          <td>
            <input type="text" placeholder="name...." style="width: 98%" />
          </td>
        </tr>
        <tr>
          <td>sex</td>
          <td>
            <div><input name="Gender" type="radio" />Male</div>
            <div><input name="Gender" type="radio" />Female</div>
          </td>
        </tr>
        <tr>
          <td>Eye Color</td>
          <td>
            <select style="width: 100%">
              <option>Red</option>
              <option>Blue</option>
              <option>Black</option>
              <option>Gray</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Check all that apply</td>
          <td>
            <div><input type="checkbox" />Over 6 feet tall</div>
            <div><input type="checkbox" />Over 200 pounds</div>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <div>Descirbe your athletic ability:</div>
            <textarea style="width: 98%" placeholder="message..."></textarea>
          </td>
        </tr>
        <tr align="center">
          <td colspan="2">
            <button>Enter my Informetion</button>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
